<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo de Vinilos</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --muted: #888888;
            --accent: #ff5252;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: -1px;
            color: #ffffff;
        }
        .stats {
            font-size: 0.9rem;
            color: var(--muted);
            background: #252525;
            padding: 6px 14px;
            border-radius: 20px;
            width: fit-content;
            font-weight: 500;
        }
        .search-bar {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: #ffffff;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(255, 82, 82, 0.2);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border-left: 5px solid var(--accent);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.5);
        }
        .title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #ffffff;
            line-height: 1.3;
        }
        .artist {
            font-size: 1.05rem;
            color: var(--accent);
            margin: 0 0 18px 0;
            font-weight: 600;
        }
        .meta-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #2d2d2d;
            padding-top: 12px;
        }
        .meta-item {
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }
        .meta-item span {
            color: #cccccc;
            font-weight: 500;
            text-align: right;
            padding-left: 10px;
        }
        .no-results {
            text-align: center;
            color: var(--muted);
            grid-column: 1 / -1;
            padding: 60px 20px;
            font-size: 1.2rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mi Colección de Vinilos 🎧</h1>
            <div class="stats" id="contador">Cargando colección...</div>
            <input type="text" id="buscador" class="search-bar" placeholder="Buscar por intérprete, título, sello, estilo o lugar...">
        </header>
        <div class="grid" id="catalogo"></div>
    </div>

    <script>
        let todosLosVinilos = [];

        Papa.parse("vinilos.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                todosLosVinilos = results.data;
                actualizarVista(todosLosVinilos);
            },
            error: function(err) {
                document.getElementById('contador').innerText = "Error al cargar el archivo 'vinilos.csv'. Asegúrate de que está en la misma carpeta.";
            }
        });

        const catalogoDiv = document.getElementById('catalogo');
        const buscador = document.getElementById('buscador');
        const contador = document.getElementById('contador');

        function normalizarTexto(texto) {
            return texto ? texto.toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "") : "";
        }

        function actualizarVista(lista) {
            contador.innerText = `Mostrando ${lista.length} de ${todosLosVinilos.length} vinilos`;
            
            if (lista.length === 0) {
                catalogoDiv.innerHTML = '<div class="no-results">No se han encontrado vinilos que coincidan con la búsqueda.</div>';
                return;
            }

            catalogoDiv.innerHTML = lista.map(v => {
                const interprete = v['Intérprete'] || v['interprete'] || v['Interprete'] || '';
                const titulo = v['Título'] || v['titulo'] || v['Titulo'] || '';
                const sello = v['Sello'] || v['sello'] || '';
                const estilo = v['Estilo'] || v['estilo'] || '';
                const lugar = v['Lugar de compra'] || v['lugar de compra'] || v['Lugar'] || v['lugar'] || '';

                return `
                    <div class="card">
                        <div class="title">${titulo || 'Sin título'}</div>
                        <div class="artist">${interprete || 'Artista desconocido'}</div>
                        <div class="meta-list">
                            <div class="meta-item">Sello: <span>${sello || '-'}</span></div>
                            <div class="meta-item">Estilo: <span>${estilo || '-'}</span></div>
                            <div class="meta-item">Lugar de compra: <span>${lugar || '-'}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        buscador.addEventListener('input', (e) => {
            const texto = normalizarTexto(e.target.value);
            const filtrados = todosLosVinilos.filter(v => {
                const interprete = v['Intérprete'] || v['interprete'] || v['Interprete'] || '';
                const titulo = v['Título'] || v['titulo'] || v['Titulo'] || '';
                const sello = v['Sello'] || v['sello'] || '';
                const estilo = v['Estilo'] || v['estilo'] || '';
                const lugar = v['Lugar de compra'] || v['lugar de compra'] || v['Lugar'] || v['lugar'] || '';

                return (normalizarTexto(interprete).includes(texto) ||
                        normalizarTexto(titulo).includes(texto) ||
                        normalizarTexto(sello).includes(texto) ||
                        normalizarTexto(estilo).includes(texto) ||
                        normalizarTexto(lugar).includes(texto));
            });
            actualizarVista(filtrados);
        });
    </script>
</body>
</html>
