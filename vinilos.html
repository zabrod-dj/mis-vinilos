<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo de Vinilos</title>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --text: #ffffff; --muted: #aaaaaa; --accent: #ff4757; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid #444; padding-bottom: 20px; }
        h1 { margin: 0; font-size: 2.5rem; letter-spacing: -1px; }
        .stats { font-size: 0.9rem; color: var(--muted); background: #333; padding: 5px 12px; border-radius: 15px; width: fit-content; }
        .search-bar { width: 100%; padding: 15px; font-size: 1.1rem; border: none; border-radius: 8px; background: var(--card); color: var(--text); box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .search-bar:focus { outline: 2px solid var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 4px solid var(--accent); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .title { font-size: 1.2rem; font-weight: bold; margin: 0 0 5px 0; color: #fff; }
        .artist { font-size: 1rem; color: var(--accent); margin: 0 0 15px 0; font-weight: 600; }
        .meta-item { font-size: 0.85rem; color: var(--muted); margin: 5px 0; display: flex; justify-content: space-between; }
        .meta-item span { color: #ddd; }
        .no-results { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 40px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mi Colección de Vinilos 🎧</h1>
            <div class="stats" id="contador">Cargando colección...</div>
            <input type="text" id="buscador" class="search-bar" placeholder="Buscar por intérprete, título, sello, estilo o lugar...">
        </header>
        <div class="grid" id="catalogo"></div>
    </div>

    <script>
        let todosLosVinilos = [];

        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.toLowerCase()
                .normalize("NFD")
                .replace(/[̀-ͯ]/g, "")
                .trim();
        }

        Papa.parse("vinilos.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                todosLosVinilos = results.data;
                actualizarVista(todosLosVinilos);
            },
            error: function(err) {
                document.getElementById('contador').innerText = "Error al cargar el archivo vinilos.csv. Asegúrate de que está en la misma carpeta.";
            }
        });

        const catalogoDiv = document.getElementById('catalogo');
        const buscador = document.getElementById('buscador');
        const contador = document.getElementById('contador');

        function encontrarValor(objeto, claveBuscada) {
            const claveNorm = normalizarTexto(claveBuscada);
            for (let k in objeto) {
                if (normalizarTexto(k).includes(claveNorm)) {
                    return objeto[k];
                }
            }
            return '-';
        }

        function actualizarVista(lista) {
            contador.innerText = `Mostrando ${lista.length} de ${todosLosVinilos.length} vinilos`;
            
            if (lista.length === 0) {
                catalogoDiv.innerHTML = '<div class="no-results">No se han encontrado vinilos que coincidan con la búsqueda.</div>';
                return;
            }

            catalogoDiv.innerHTML = lista.map(v => {
                const titulo = encontrarValor(v, 'titulo') || encontrarValor(v, 'album') || 'Sin título';
                const interprete = encontrarValor(v, 'interprete') || encontrarValor(v, 'artista') || 'Artista desconocido';
                const sello = encontrarValor(v, 'sello') || '-';
                const estilo = encontrarValor(v, 'estilo') || encontrarValor(v, 'genero') || '-';
                const lugar = encontrarValor(v, 'lugar') || encontrarValor(v, 'compra') || '-';

                return `
                    <div class="card">
                        <div class="title">${titulo}</div>
                        <div class="artist">${interprete}</div>
                        <div class="meta-item">Sello: <span>${sello}</span></div>
                        <div class="meta-item">Estilo: <span>${estilo}</span></div>
                        <div class="meta-item">Lugar de compra: <span>${lugar}</span></div>
                    </div>
                `;
            }).join('');
        }

        buscador.addEventListener('input', (e) => {
            const texto = normalizarTexto(e.target.value);
            const filtrados = todosLosVinilos.filter(v => {
                const valoresConcat = Object.values(v).map(val => normalizarTexto(val)).join(' ');
                return valoresConcat.includes(texto);
            });
            actualizarVista(filtrados);
        });
    </script>
</body>
</html>
