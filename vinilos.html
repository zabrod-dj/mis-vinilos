<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo de Vinilos</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #3182ce;
            --youtube: #e53e3e;
            --discogs: #2d3748;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h1 { margin: 0; font-size: 2.2rem; color: #1a202c; letter-spacing: -0.5px; }
        .stats {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            background: #ebf8ff;
            padding: 6px 16px;
            border-radius: 20px;
            width: fit-content;
        }
        .search-bar {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-bar:focus { outline: none; border-color: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid #edf2f7;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        
        .cover-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #e2e8f0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-placeholder {
            text-align: center;
            color: var(--text-muted);
            font-size: 3rem;
        }

        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .title { font-size: 1.15rem; font-weight: 700; margin: 0 0 6px 0; color: #1a202c; line-height: 1.3; }
        .artist { font-size: 1rem; color: var(--accent); margin: 0 0 15px 0; font-weight: 600; }
        
        .meta-group { margin-top: auto; border-top: 1px solid #edf2f7; padding-top: 12px; }
        .meta-item { font-size: 0.85rem; color: var(--text-muted); margin: 6px 0; display: flex; justify-content: space-between; }
        .meta-item span { color: var(--text-main); font-weight: 500; }
        
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-youtube { background: var(--youtube); color: white; }
        .btn-discogs { background: var(--discogs); color: white; }
        
        .no-results { text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 40px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mi Colección de Vinilos 🎧</h1>
            <div class="stats" id="contador">Buscando discos en el archivo...</div>
            DVDBBC
            <input type="text" id="buscador" class="search-bar" placeholder="Buscar por intérprete, título, sello, estilo o lugar...">
        </header>
        <div class="grid" id="catalogo"></div>
    </div>

    <script>
        let todosLosVinilos = [];

        Papa.parse("vinilos.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                todosLosVinilos = results.data;
                actualizarVista(todosLosVinilos);
            },
            error: function() {
                document.getElementById('contador').innerText = "Error crítico: No encuentro el archivo 'vinilos.csv'.";
            }
        });

        const catalogoDiv = document.getElementById('catalogo');
        const buscador = document.getElementById('buscador');
        const contador = document.getElementById('contador');

        function getValor(objeto, clavesPosibles) {
            for (let clave of clavesPosibles) {
                const encontrada = Object.keys(objeto).find(k => 
                    k.toLowerCase().replace(/[íáéóú]/g, x => ({'í':'i','á':'a','é':'e','ó':'o','ú':'u'})[x]).trim() === clave
                );
                if (encontrada && objeto[encontrada]) return objeto[encontrada].trim();
            }
            return '-';
        }

        function actualizarVista(lista) {
            contador.innerText = `Mostrando ${lista.length} de ${todosLosVinilos.length} vinilos`;
            
            if (lista.length === 0) {
                catalogoDiv.innerHTML = '<div class="no-results">Ningún vinilo coincide con tu búsqueda.</div>';
                return;
            }

            catalogoDiv.innerHTML = lista.map(v => {
                const artista = getValor(v, ['interprete', 'artista', 'autor']);
                const titulo = getValor(v, ['titulo', 'album', 'nombre']);
                const sello = getValor(v, ['sello', 'discografica']);
                const estilo = getValor(v, ['estilo', 'genero']);
                const lugar = getValor(v, ['lugar de compra', 'lugar_de_compra', 'lugar', 'tienda']);

                const terminoBusqueda = encodeURIComponent(`${artista} ${titulo}`);
                const urlYoutube = `https://www.youtube.com/results?search_query=${terminoBusqueda}+full+album`;
                const urlDiscogs = `https://www.discogs.com/search/?q=${terminoBusqueda}&type=release`;
                
                const urlPortada = `https://itunes.apple.com/search?term=${terminoBusqueda}&entity=album&limit=1`;
                const cardId = `img-${btoa(terminoBusqueda).replace(/=/g, '')}`;

                fetch(urlPortada)
                    .then(res => res.json())
                    .then(data => {
                        const imgEl = document.getElementById(cardId);
                        if (imgEl && data.results && data.results[0]) {
                            const altaCalidad = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                            imgEl.innerHTML = `<img class="cover-image" src="${altaCalidad}" alt="Portada" loading="lazy">`;
                        }
                    }).catch(() => {});

                return `
                    <div class="card">
                        <div class="cover-container" id="${cardId}">
                            <div class="cover-placeholder">📻</div>
                        </div>
                        <div class="card-content">
                            <div class="title">${titulo}</div>
                            <div class="artist">${artista}</div>
                            
                            <div class="meta-group">
                                <div class="meta-item">Sello: <span>${sello}</span></div>
                                <div class="meta-item">Estilo: <span>${estilo}</span></div>
                                <div class="meta-item">Lugar: <span>${lugar}</span></div>
                            </div>

                            <div class="actions">
                                <a href="${urlYoutube}" target="_blank" class="btn btn-youtube">🎬 YouTube</a>
                                <a href="${urlDiscogs}" target="_blank" class="btn btn-discogs">📀 Discogs</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        buscador.addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = todosLosVinilos.filter(v => {
                return Object.values(v).some(val => val.toLowerCase().includes(texto));
            });
            actualizarVista(filtrados);
        });
    </script>
</body>
</html>
