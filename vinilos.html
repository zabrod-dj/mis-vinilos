<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo de Vinilos</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-muted: #6c757d;
            --accent: #1e3d59;
            --border: #e9ecef;
            --tag-bg: #f1f3f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stats {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 40px auto;
        }
        .search-bar {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            border: 1px solid #ced4da;
            border-radius: 30px;
            background: var(--card-bg);
            color: var(--text-main);
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(30, 61, 89, 0.15);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .card-body {
            flex-grow: 1;
        }
        .title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-main);
            line-height: 1.3;
        }
        .artist {
            font-size: 1.05rem;
            color: var(--accent);
            margin: 0 0 16px 0;
            font-weight: 600;
        }
        .meta-list {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 12px;
        }
        .meta-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .meta-label {
            font-weight: 500;
            color: #868e96;
        }
        .meta-value {
            font-weight: 500;
            color: var(--text-main);
            background: var(--tag-bg);
            padding: 2px 8px;
            border-radius: 4px;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .no-results {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 60px 20px;
            font-size: 1.1rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed #dee2e6;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mi Colección de Vinilos 🎧</h1>
            <div class="stats" id="contador">Buscando tu archivo de discos...</div>
        </header>
        
        <div class="search-container">
            <input type="text" id="buscador" class="search-bar" placeholder="Buscar artista, álbum, sello, estilo o lugar...">
        </div>

        <div class="grid" id="catalogo"></div>
    </div>

    <script>
        let todosLosVinilos = [];

        // Leer el archivo CSV automáticamente detectando comas o puntos y comas
        Papa.parse("vinilos.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                todosLosVinilos = results.data;
                actualizarVista(todosLosVinilos);
            },
            error: function(err) {
                document.getElementById('contador').innerText = "Error: Asegúrate de que el archivo se llama exactamente 'vinilos.csv' y está en la misma carpeta de GitHub.";
            }
        });

        const catalogoDiv = document.getElementById('catalogo');
        const buscador = document.getElementById('buscador');
        const contador = document.getElementById('contador');

        // Función inteligente para buscar valores ignorando mayúsculas y minúsculas en las columnas
        function obtenerValorColumna(objeto, palabrasClave) {
            const claves = Object.keys(objeto);
            for (let clave of claves) {
                const claveLimpia = clave.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
                for (let palabra of palabrasClave) {
                    if (claveLimpia === palabra) {
                        return objeto[clave] || '';
                    }
                }
            }
            return '';
        }

        function actualizarVista(lista) {
            contador.innerText = `Tienes un total de ${todosLosVinilos.length} vinilos | Mostrando ${lista.length} en la búsqueda`;
            
            if (lista.length === 0) {
                catalogoDiv.innerHTML = '<div class="no-results">No hemos encontrado ningún vinilo que coincida con lo que buscas.</div>';
                return;
            }

            catalogoDiv.innerHTML = lista.map(v => {
                const titulo = obtenerValorColumna(v, ['titulo']);
                const interprete = obtenerValorColumna(v, ['interprete', 'artista']);
                const sello = obtenerValorColumna(v, ['sello', 'discografica']);
                const estilo = obtenerValorColumna(v, ['estilo', 'genero']);
                const lugar = obtenerValorColumna(v, ['lugar de compra', 'lugardecompra', 'lugar']);

                return `
                    <div class="card">
                        <div class="card-body">
                            <div class="title">${titulo || 'Sin título'}</div>
                            <div class="artist">${interprete || 'Artista desconocido'}</div>
                            <div class="meta-list">
                                <div class="meta-item">
                                    <span class="meta-label">Sello</span>
                                    <span class="meta-value" title="${sello || '-'}">${sello || '-'}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Estilo</span>
                                    <span class="meta-value" title="${estilo || '-'}">${estilo || '-'}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Lugar de compra</span>
                                    <span class="meta-value" title="${lugar || '-'}">${lugar || '-'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        buscador.addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
            
            const filtrados = todosLosVinilos.filter(v => {
                const textoFila = Object.values(v).join(' ').toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                return textoFila.includes(texto);
            });
            
            actualizarVista(filtrados);
        });
    </script>
</body>
</html>
